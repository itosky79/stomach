<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>胃の物理 試作</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<style>
:root{--bg:#0A0F14; --panel:#101820; --line:#23404E; --text:#DCEBF0; --muted:#8FA9B4; --teal:#52B8CE}
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif; font-size:13px}
#gl{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none}
#ui{position:fixed; right:12px; top:12px; width:250px; background:rgba(16,24,32,.92); border:1px solid var(--line);
  border-radius:4px; padding:10px 12px; display:grid; gap:9px}
#ui h1{font-size:13px; margin:0 0 2px; font-weight:600}
#ui p{margin:0; color:var(--muted); font-size:11.5px; line-height:1.5}
label{display:grid; grid-template-columns:72px 1fr 38px; align-items:center; gap:6px; font-size:12px}
label output{color:var(--muted); font-family:ui-monospace,monospace; font-size:11px; text-align:right}
input[type=range]{width:100%}
.row{display:flex; gap:6px; flex-wrap:wrap}
button{background:#13242F; color:var(--text); border:1px solid var(--line); border-radius:3px; padding:5px 9px; font-size:12px; cursor:pointer}
button[aria-pressed=true]{border-color:var(--teal); color:var(--teal)}
#vr{border-color:var(--teal); color:var(--teal)}
#perf{position:fixed; left:12px; top:12px; white-space:pre; pointer-events:none; font-family:ui-monospace,monospace; font-size:11px;
  line-height:1.5; background:rgba(5,8,11,.8); border:1px solid var(--line); border-radius:3px; padding:6px 9px}
#err{position:fixed; inset:0; display:none; place-items:center; padding:24px; text-align:center; line-height:1.7}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="perf">計測中…</div>
<div id="ui">
  <h1>胃の物理 試作</h1>
  <p>胃の前でマウスを押し続けると圧迫筒で押します。VR ではコントローラーの先が圧迫筒です。</p>
  <label>粘度<input id="visc" type="range" min="0" max="100" value="60"><output></output></label>
  <label>付着<input id="adh" type="range" min="0" max="100" value="50"><output></output></label>
  <label>バリウム<input id="ml" type="range" min="50" max="400" step="10" value="150"><output></output></label>
  <label>ガス<input id="gas" type="range" min="60" max="140" value="100"><output></output></label>
  <label>傾き<input id="tilt" type="range" min="-90" max="90" value="0"><output></output></label>
  <label>回転<input id="roll" type="range" min="-180" max="180" value="0"><output></output></label>
  <div class="row" id="res">
    <button type="button" data-r="0">粗い</button>
    <button type="button" data-r="1" aria-pressed="true">普通</button>
    <button type="button" data-r="2">細かい</button>
  </div>
  <div class="row" id="view">
    <button type="button" data-v="front" aria-pressed="true">正面</button>
    <button type="button" data-v="side">横</button>
    <button type="button" data-v="top">上</button>
  </div>
  <div class="row">
    <button type="button" id="refill">飲み直す</button>
    <button type="button" id="vr" hidden>VR</button>
  </div>
</div>
<div id="err"></div>
<script type="module" src="main.js"></script>
<script>
addEventListener('load', function () {
  setTimeout(function () {
    if (window.PROTO_OK) return;
    var e = document.getElementById('err'); e.style.display = 'grid';
    e.textContent = location.protocol === 'file:'
      ? 'ファイルを直接開いても動きません。公開 URL から開いてください。'
      : '読み込みに失敗しました。ページを開き直してください。';
  }, 1500);
});
</script>
</body>
</html>
